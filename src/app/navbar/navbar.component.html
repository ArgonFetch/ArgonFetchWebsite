<header id="header" [class.scrolled]="isScrolled">
  <nav class="nav">
    <a routerLink="/" (click)="closeMobileMenuAndScroll('hero')" class="logo">
      <img src="logo-simple.svg" alt="" aria-hidden="true" />
      <span class="wordmark">ArgonFetch</span>
    </a>

    <div class="nav-links" id="navLinks" [class.active]="isMobileMenuOpen">
      <a routerLink="/" fragment="usage" (click)="closeMobileMenuAndScroll('usage')"
        [class.active]="isActiveSection('usage')" class="nav-link">How it works</a>
      <a routerLink="/" fragment="features" (click)="closeMobileMenuAndScroll('features')"
        [class.active]="isActiveSection('features')" class="nav-link">Features</a>
      <a routerLink="/" fragment="interface" (click)="closeMobileMenuAndScroll('interface')"
        [class.active]="isActiveSection('interface')" class="nav-link">Interface</a>
      <a [href]="docsUrl" target="_blank" rel="noopener noreferrer" (click)="closeMobileMenu()"
        class="nav-link">Docs</a>

      <a href="https://github.com/ArgonFetch/ArgonFetch" target="_blank" rel="noopener noreferrer"
        (click)="closeMobileMenu()" class="nav-action">
        <fa-icon [icon]="faGithub"></fa-icon>
        <span>GitHub</span>
      </a>
    </div>

    <button class="mobile-menu-btn" (click)="toggleMobileMenu()"
      [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      [attr.aria-expanded]="isMobileMenuOpen" aria-controls="navLinks">
      <lucide-icon [img]="isMobileMenuOpen ? XIcon : MenuIcon" [size]="18"></lucide-icon>
    </button>
  </nav>
</header>
