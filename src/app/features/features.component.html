<section id="features" class="features">
  <div class="container">
    <header class="section-head">
      <p class="eyebrow">What it does</p>
      <h2 class="section-title">Six things worth running it for</h2>
      <p class="section-lede">
        ArgonFetch is a small service. Use the hosted one or run your own copy;
        either way, this is what you get.
      </p>
    </header>

    <!--
      A datasheet, not a card wall: one bounded block, hairline-ruled into
      cells. The mono labels are categories - nothing here is a sequence, so
      nothing here is numbered.
    -->
    <div class="sheet">
      <article class="cell" *ngFor="let capability of capabilities">
        <div class="cell-label">
          <lucide-icon [img]="capability.icon" [size]="15"></lucide-icon>
          <span>{{ capability.label }}</span>
        </div>
        <h3>{{ capability.title }}</h3>
        <p>{{ capability.body }}</p>
      </article>
    </div>
  </div>
</section>
