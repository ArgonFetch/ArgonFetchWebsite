<!--
  The page cools here: the dark discharge gives way to a light band. The band
  opens out of a rounded window as it scrolls in.
-->
<section id="features" class="features" #section>
  <div class="paper" #paper>
    <div class="inner">
      <header class="head">
        <h2 class="section-title">Small on purpose.</h2>
        <p class="section-lede">
          ArgonFetch is one small service. Use the hosted one or run your own copy.
          Either way, this is all of it.
        </p>
      </header>

      <ul class="rows">
        <li class="row" *ngFor="let capability of capabilities" #row>
          <h3>{{ capability.title }}</h3>
          <p>{{ capability.body }}</p>
        </li>
      </ul>
    </div>
  </div>
</section>
