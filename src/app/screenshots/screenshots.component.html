<section id="interface" class="interface" #section>
  <div class="inner">
    <header class="head">
      <h2 class="section-title">This is the<br />whole app.</h2>
      <p class="section-lede">
        One field, one list of formats, one button. There is nothing else to learn.
      </p>
    </header>

    <!-- The shot tilts up off the page and settles flat as you reach it. -->
    <div class="stage" #stage>
      <figure class="frame" #frame>
        <img src="app-interface.png"
          alt="The ArgonFetch web interface with a YouTube link resolved to Big Buck Bunny, and the video menu open on 2160p, 1080p, 360p and 144p MP4 downloads with their file sizes."
          loading="lazy" decoding="async" width="2440" height="1220" />
      </figure>
    </div>

    <p class="caption">
      A link resolved, video formats open. Big Buck Bunny, CC BY Blender Foundation.
      <a href="https://app.argonfetch.dev" target="_blank" rel="noopener noreferrer">
        Try it at app.argonfetch.dev
        <lucide-icon [img]="ArrowUpRightIcon" [size]="15"></lucide-icon>
      </a>
    </p>
  </div>
</section>
