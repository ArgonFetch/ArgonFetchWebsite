<div class="docs-shell">
  <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="isSidebarOpen"
    aria-controls="docsSidebar">
    <lucide-icon [img]="isSidebarOpen ? XIcon : MenuIcon" [size]="16"></lucide-icon>
    <span>{{ isSidebarOpen ? 'Close' : 'Menu' }}</span>
  </button>

  <aside class="docs-sidebar" id="docsSidebar" [class.is-open]="isSidebarOpen">
    <nav aria-label="Documentation">
      <div class="nav-group" *ngFor="let group of groups">
        <h2>{{ group.title }}</h2>
        <ul>
          <li *ngFor="let link of group.links">
            <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
          </li>
        </ul>
      </div>
    </nav>
  </aside>

  <main class="docs-main">
    <router-outlet></router-outlet>

    <!-- Prev/next walks the sidebar order, so the docs read straight through. -->
    <nav class="page-nav" aria-label="Pagination">
      <a *ngIf="previous" [routerLink]="previous.path" class="page-nav-link prev">
        <span class="direction">
          <lucide-icon [img]="ArrowLeftIcon" [size]="14"></lucide-icon> Previous
        </span>
        <span class="title">{{ previous.label }}</span>
      </a>
      <a *ngIf="next" [routerLink]="next.path" class="page-nav-link next">
        <span class="direction">
          Next <lucide-icon [img]="ArrowRightIcon" [size]="14"></lucide-icon>
        </span>
        <span class="title">{{ next.label }}</span>
      </a>
    </nav>
  </main>
</div>
