<section id="usage" class="usage">
  <div class="container">
    <header class="section-head">
      <p class="eyebrow">How it works</p>
      <h2 class="section-title">Three steps, start to file</h2>
      <p class="section-lede">
        Once ArgonFetch is running, open it in a browser and the whole job takes
        about fifteen seconds.
      </p>
    </header>

    <!-- Ordered, because the order is real: nothing to pick until it resolves. -->
    <ol class="steps">
      <li class="step" *ngFor="let step of steps; let i = index">
        <span class="step-index">{{ i + 1 }}</span>
        <span class="step-icon">
          <lucide-icon [img]="step.icon" [size]="18"></lucide-icon>
        </span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.body }}</p>
      </li>
    </ol>
  </div>
</section>
